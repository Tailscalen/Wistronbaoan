<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00384f">
<title>SOP Lưu Trình An Ninh / SOP 安保流程</title>
<meta name="description" content="Tra cứu quy trình an ninh: hướng dẫn, tài liệu và liên hệ trực ban.">
<meta property="og:type" content="website">
<meta property="og:title" content="SOP Lưu Trình An Ninh / SOP 安保流程">
<meta property="og:description" content="Tra cứu quy trình an ninh: hướng dẫn, tài liệu và liên hệ trực ban.">
<!--
  SOP Lưu Trình An Ninh – trang công khai chạy trên GitHub Pages, có tài khoản quản trị.
  Tệp trong repo:
    index.html – trang này
    data.json  – nội dung trang (tự tạo ở lần "Đăng" đầu tiên)
    admin.json – khóa quản trị đã mã hóa (tự tạo khi kích hoạt)
    files/     – PPTX, PDF, ảnh… tải lên từ trang
  Không ghi mật khẩu vào tệp này: ai cũng xem được mã nguồn của trang GitHub Pages.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --teal:#00668c;--teal-600:#005879;--teal-deep:#00384f;--teal-50:#ebf4f8;--teal-100:#d3e7ef;
  --green:#8cc63f;--green-hi:#9bd34f;--green-ink:#1f3a06;
  --paper:#f3f5f6;--surface:#fff;--ink:#13232c;--ink-2:#33454f;--steel:#5d6d76;--faint:#8e9da6;
  --line:#dce3e7;--line-2:#c6d0d6;--danger:#b8322a;
  --display:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:16px;line-height:1.55;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{width:100%;max-width:1140px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.grow{flex:1}
.zh{letter-spacing:.03em}

/* ---------- Thanh trên cùng ---------- */
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{display:flex;align-items:center;gap:12px;height:60px}
.topbar-in .icon-btn+.icon-btn{margin-left:-8px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;color:var(--ink);text-decoration:none}
.brand img{display:block;height:28px;width:auto;max-width:150px;object-fit:contain}
.mark{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:8px;background:var(--teal);color:#fff}
.brand-sep{flex:none;width:1px;height:24px;background:var(--line-2)}
.brand-label{overflow:hidden;font-family:var(--display);font-size:18px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;padding:0;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--steel);text-decoration:none;cursor:pointer}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
.icon-btn.sm{width:36px;height:36px;border-radius:9px}
.icon-btn.line{border-color:var(--line);background:#fff}

/* ---------- Đầu trang ---------- */
.mast{background:var(--teal-deep);color:#fff;border-bottom:5px solid var(--green)}
.mast-in{padding-top:46px;padding-bottom:42px}
.mast h1{margin:0;font-family:var(--display);font-size:clamp(34px,6.4vw,58px);font-weight:700;line-height:1.04;letter-spacing:-.005em}
.mast .zh{margin:10px 0 0;font-size:clamp(18px,2.6vw,24px);font-weight:400;line-height:1.3;color:#a7cbd9;letter-spacing:.06em}
.mast .intro{max-width:62ch;margin:16px 0 0;font-size:16px;line-height:1.6;color:#cfe3ea}
.search{position:relative;display:block;max-width:600px;margin-top:30px}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--steel);pointer-events:none}
.search input{display:block;width:100%;height:56px;padding:0 18px 0 52px;border:2px solid transparent;border-radius:10px;background:#fff;color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--green)}

/* ---------- Bố cục chính ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-top:28px;padding-bottom:48px}
@media (min-width:940px){.main{grid-template-columns:minmax(0,1fr) 330px;gap:32px}.aside{position:sticky;top:84px}}
.main.solo{grid-template-columns:minmax(0,1fr)}
.col,.aside{min-width:0}
.aside{align-self:start}

/* ---------- Danh mục ---------- */
.panel{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:18px 22px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2}
.panel-head h2 .zh{display:block;margin-top:3px;font-family:var(--body);font-size:14px;font-weight:400;color:var(--steel)}
.count{flex:none;font-size:14px;color:var(--steel);text-align:right}
.reg{margin:0;padding:0;list-style:none}
.reg>li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) 22px;align-items:center;gap:0 16px;padding:16px 18px 16px 22px;background:var(--surface);color:inherit;text-decoration:none}
.row:hover{background:#f6f9fa}
.row:hover .row-title{color:var(--teal)}
.row:active{background:var(--teal-50)}
.row-text{min-width:0}
.row-title{display:block;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.28;color:var(--ink)}
.row-zh{display:block;margin-top:3px;font-size:15px;line-height:1.45;color:var(--steel)}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-size:13px;color:var(--faint)}
.row-go{display:grid;place-items:center;color:var(--faint)}
.row:hover .row-go{color:var(--teal)}
.empty{padding:34px 22px;text-align:center;color:var(--steel)}
.empty .zh{display:block;margin-top:4px;font-size:14px}

/* Ô định dạng: cho biết bấm vào sẽ mở gì */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:48px;height:52px;border-radius:9px;font-family:var(--display);font-size:11.5px;font-weight:600;line-height:1}
.tile>span{text-align:center}
.tile.sm{width:40px;height:44px;border-radius:8px;font-size:10.5px}
.tile.wide{flex-direction:row;gap:6px;width:auto;height:28px;padding:0 10px;border-radius:7px;font-size:13px}
.t-web{background:var(--teal-50);color:var(--teal)}
.t-text{background:#edf0f2;color:#4b5b64}
.t-pptx{background:#fbe8e0;color:#b7472a}
.t-pdf{background:#fde7e6;color:#b42318}
.t-doc{background:#e5edfa;color:#2b579a}
.t-xls{background:#e2f1e7;color:#217346}
.t-img{background:#efe8f8;color:#6b46c1}

/* Thông báo */
.notice{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding:14px 16px;border:1px solid #efd98a;border-radius:12px;background:#fff8dc;color:#47390a;font-size:15.5px;line-height:1.55}
.notice .sign{flex:none;margin-top:1px}
.notice .zh{margin-top:3px;color:#6b5a1c}

/* Trực ban – kiểu biển báo điện thoại khẩn cấp */
.sos{display:block;padding:22px;border-radius:14px;background:var(--teal-deep);color:#fff;text-decoration:none}
.sos-top{display:flex;align-items:center;gap:14px}
.sos-sign{display:grid;place-items:center;flex:none;width:58px;height:58px;border-radius:8px;background:var(--green);color:var(--green-ink)}
.sos-label{display:block;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2}
.sos-zh{display:block;margin-top:3px;font-size:14.5px;color:#a7cbd9;letter-spacing:.05em}
.sos-num{display:block;margin-top:20px;font-family:var(--display);font-size:36px;font-weight:700;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sos-btn{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;margin-top:18px;border-radius:10px;background:var(--green);color:var(--green-ink);font-size:17px;font-weight:600}
.sos-btn .zh{font-weight:500;opacity:.75}
.sos:hover .sos-btn{background:var(--green-hi)}

/* Chân trang */
.foot{border-top:1px solid var(--line);background:var(--surface)}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));font-size:13.5px;color:var(--steel)}
body.is-admin .foot-in{padding-bottom:calc(100px + env(safe-area-inset-bottom))}

/* ---------- Trang nội dung ---------- */
.detail{max-width:900px;padding-top:22px;padding-bottom:48px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:6px 2px;color:var(--teal);font-size:15.5px;font-weight:600;text-decoration:none}
.back .zh{font-size:14px;font-weight:400;color:var(--steel)}
.back:hover span:first-of-type{text-decoration:underline;text-underline-offset:3px}
.doc{padding:30px 32px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.doc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px;color:var(--steel)}
.doc-title{margin:14px 0 0;font-family:var(--display);font-size:clamp(27px,4.4vw,40px);font-weight:700;line-height:1.1}
.doc-zh{margin:8px 0 0;font-size:18px;color:var(--steel)}
.doc-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.doc-body{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.doc-files{margin-top:30px}
.doc-files h2{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;font-family:var(--display);font-size:21px;font-weight:600}
.doc-files h2 .zh{font-family:var(--body);font-size:14px;font-weight:400;color:var(--steel)}
.detail .sos{max-width:440px;margin-top:22px}
@media (max-width:600px){.doc{padding:22px 18px;border-radius:12px}}

.att+.att{margin-top:16px}
.att-head{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:12px 12px 0 0;background:#f8fafb}
.att-head.solo{border-radius:12px}
.att-info{display:flex;flex:1;flex-direction:column;min-width:0}
.att-name{font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
.att-size{font-size:13px;color:var(--steel)}
.att-actions{display:flex;flex:none;gap:6px}
.viewer{overflow:hidden;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:#e6ebee}
.viewer iframe{display:block;width:100%;min-height:260px;aspect-ratio:16/10.5;border:0;background:#e6ebee}
.viewer.tall iframe{height:78vh;min-height:420px;aspect-ratio:auto}
.viewer img{display:block;width:100%;height:auto}

/* Nội dung bài viết */
.prose{max-width:72ch;font-size:16.5px;line-height:1.72;color:var(--ink-2);overflow-wrap:break-word}
.prose>:first-child{margin-top:0}
.prose>:last-child{margin-bottom:0}
.prose p{margin:0 0 .9em}
.prose h2{margin:1.6em 0 .55em;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.25;color:var(--ink)}
.prose h3{margin:1.4em 0 .45em;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.3;color:var(--ink)}
.prose h4{margin:1.2em 0 .4em;font-size:17px;color:var(--ink)}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.3em 0}
.prose li::marker{color:var(--teal)}
.prose a{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
.prose strong,.prose b{color:var(--ink)}
.prose blockquote{margin:1.2em 0;padding:12px 16px;border-left:4px solid var(--green);border-radius:0 8px 8px 0;background:#f4f9ec;color:var(--ink-2)}
.prose hr{margin:1.6em 0;border:0;border-top:1px solid var(--line)}
.prose table{display:block;max-width:100%;margin:1.2em 0;overflow-x:auto;border-collapse:collapse;font-size:15px;line-height:1.5}
.prose th,.prose td{padding:8px 12px;border:1px solid var(--line-2);text-align:left;vertical-align:top}
.prose th{background:#f1f4f6;color:var(--ink);font-weight:600}
.prose img{max-width:100%;height:auto;border-radius:8px}

/* ---------- Nút & biểu mẫu ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border:1px solid var(--line-2);border-radius:10px;background:#fff;color:var(--ink);font-size:15.5px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--paper)}
.btn .zh{font-weight:400;opacity:.8}
.btn.primary{border-color:var(--teal);background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-600)}
.btn.block{width:100%;margin-top:6px}
.btn:disabled{opacity:.6;cursor:default}
.field{display:block;margin:0 0 16px}
.field>span:first-child,.lbl{display:block;margin-bottom:7px;font-size:14px;font-weight:600;color:var(--ink-2)}
.field em,.lbl em{font-style:normal;font-weight:400;color:var(--faint)}
.input{display:block;width:100%;height:46px;padding:0 13px;border:1px solid var(--line-2);border-radius:10px;background:#fff;color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
textarea.input{height:auto;min-height:76px;padding:11px 13px;line-height:1.5;resize:vertical}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,102,140,.14)}
.input.mono{font-family:var(--mono);font-size:14px}
.hint{display:block;margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--steel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.err{margin:4px 0 0;color:var(--danger);font-size:14px;line-height:1.5}
.err:empty{display:none}
.linkish{padding:0;border:0;background:none;color:var(--teal);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.m-alt{margin-top:14px;text-align:center}
.lead{margin:0 0 16px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.help{margin:-4px 0 16px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;font-size:14px}
.help summary{padding:10px 12px;color:var(--ink-2);font-weight:600;list-style:none;cursor:pointer}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"";display:inline-block;width:7px;height:7px;margin:0 10px 2px 2px;border-right:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(-45deg)}
.help[open] summary::before{transform:rotate(45deg)}
.help-in{padding:0 14px 12px}
.help ol{margin:0;padding-left:18px;line-height:1.65;color:var(--ink-2)}
.spin{flex:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Chọn kiểu mục */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 18px;padding:5px;border:1px solid var(--line-2);border-radius:12px;background:#f4f6f7}
.seg .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink-2);text-align:left;cursor:pointer}
.seg .opt svg{flex:none;margin-top:1px;color:var(--steel)}
.seg .opt b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.seg .opt small{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--steel)}
.seg .opt.on{border-color:var(--teal);background:#fff;color:var(--ink)}
.seg .opt.on svg{color:var(--teal)}
@media (max-width:440px){.seg{grid-template-columns:1fr}}

/* ---------- Chế độ quản trị ---------- */
.tools{display:flex;align-items:center;gap:6px;padding:0 16px 12px 86px}
.tools .sp{flex:1}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-2);font-size:14px;font-weight:600;cursor:pointer}
.tool:hover:not(:disabled){border-color:var(--line-2);background:var(--paper)}
.tool:disabled{opacity:.35;cursor:default}
.tool.ico{width:34px;padding:0}
.tool.danger{color:var(--danger)}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-top:1px solid var(--line);background:#fafbfc;color:var(--teal);font-size:16px;font-weight:600;cursor:pointer}
.add-row:hover{background:var(--teal-50)}
.adminbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:2px;max-width:calc(100vw - 20px);padding:6px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%)}
.ab-status{display:inline-flex;align-items:center;gap:8px;height:28px;margin-right:4px;padding:0 12px 0 10px;border-right:1px solid rgba(255,255,255,.14);color:#a9bcc6;font-size:13px;font-weight:600;white-space:nowrap}
.ab-status i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.ab-btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 13px;border:0;border-radius:11px;background:transparent;color:#dbe6ec;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.ab-btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:#fff}
.ab-btn.primary{background:var(--green);color:var(--green-ink)}
.ab-btn.primary:hover:not(:disabled){background:var(--green-hi);color:var(--green-ink)}
.ab-btn.primary:disabled{background:rgba(255,255,255,.08);color:#71879a;cursor:default}
.ab-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--green-ink);color:#fff;font-size:12px}
@media (max-width:560px){.ab-btn:not(.primary) .t,.ab-status .t{display:none}.ab-status{padding:0 10px}.tools{padding-left:72px}}

/* ---------- Hộp thoại ---------- */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,20,28,.55);animation:fadeIn .15s ease}
.modal{display:flex;flex-direction:column;width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:popIn .18s ease}
.modal.md{max-width:640px}
.modal.lg{max-width:840px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 22px;border-bottom:1px solid var(--line)}
.m-head h3{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--display);font-size:21px;font-weight:600}
.m-body{flex:1 1 auto;min-height:0;padding:20px 22px;overflow:auto;-webkit-overflow-scrolling:touch}
.m-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#f9fafb}
.set-sec{margin:24px 0 14px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--display);font-size:18px;font-weight:600}
.set-sec:first-child{margin-top:0;padding-top:0;border-top:0}
.set-sec em{display:block;margin-top:2px;font-family:var(--body);font-size:14px;font-style:normal;font-weight:400;color:var(--faint)}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-row .input{flex:1;min-width:0}
.logo-prev{display:grid;place-items:center;flex:none;width:76px;height:46px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--teal)}
.logo-prev img{max-width:66px;max-height:36px;object-fit:contain}
@media (max-width:480px){.logo-row{flex-wrap:wrap}.logo-row .input{flex-basis:100%;order:3}}
@media (max-width:640px){
  .overlay.sheet{align-items:stretch;padding:0}
  .overlay.sheet .modal{max-width:none;max-height:none;height:100%;border-radius:0}
  .overlay.sheet .m-head{padding-top:calc(14px + env(safe-area-inset-top))}
}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(8px)}}

/* Trình soạn thảo */
.rte{overflow:hidden;border:1px solid var(--line-2);border-radius:10px;background:#fff}
.rte:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,102,140,.14)}
.rte-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:#f8fafb}
.rte-bar button{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 9px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600;cursor:pointer}
.rte-bar button:hover{background:#e6ecf0;color:var(--ink)}
.rte-bar .sep{width:1px;margin:7px 4px;background:var(--line-2)}
.rte-area{position:relative;min-height:240px;max-height:52vh;padding:16px 18px;overflow:auto;outline:none}
.rte-area.is-empty::before{content:attr(data-ph);position:absolute;top:16px;left:18px;right:18px;color:var(--faint);pointer-events:none}
@media (max-width:640px){.rte-area{max-height:none;min-height:280px}}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:22px 16px;border:1.5px dashed var(--line-2);border-radius:12px;background:#fafbfc;color:var(--steel);font-size:14px;text-align:center;cursor:pointer}
.drop *{pointer-events:none}
.drop b{color:var(--ink-2);font-size:15px}
.drop svg{margin-bottom:4px;color:var(--teal)}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--teal-50)}
.flist{display:flex;flex-direction:column;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.flist:empty{display:none}
.frow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.f-info{display:flex;flex:1;flex-direction:column;min-width:0}
.f-name{overflow:hidden;font-size:14.5px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.f-size{font-size:13px;color:var(--steel)}
.prog{height:4px;margin-top:6px;overflow:hidden;border-radius:2px;background:var(--line)}
.prog i{display:block;width:0;height:100%;background:var(--teal)}

/* Thông báo nhỏ */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);transform:translateX(-50%);pointer-events:none}
body.is-admin .toasts{bottom:calc(86px + env(safe-area-inset-bottom))}
.toast{padding:12px 16px;border-left:4px solid #6b8796;border-radius:10px;background:var(--ink);color:#fff;font-size:14.5px;line-height:1.45;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:popIn .2s ease;transition:opacity .3s}
.toast.ok{border-left-color:var(--green)}
.toast.bad{border-left-color:#ff7a6e}
.toast.out{opacity:0}

/* Khung chờ tải */
.sk-line{height:16px;margin:0 0 12px;border-radius:8px;background:rgba(255,255,255,.12)}
.sk{height:86px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff 0%,#f1f4f6 50%,#fff 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}

@media (max-width:520px){
  .mast-in{padding-top:32px;padding-bottom:30px}
  .panel-head{padding:16px 16px 14px}
  .row{grid-template-columns:42px minmax(0,1fr) 18px;gap:0 13px;padding:15px 14px 15px 16px}
  .tile{width:42px;height:46px;font-size:10.5px}
  .tile.wide{width:auto;height:28px;font-size:13px}
  .row-title{font-size:18px}
  .brand img{height:24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  .topbar,.adminbar,.toasts,.search,.tools,.add-row,.doc-actions,.att-actions{display:none!important}
  body{background:#fff}
  .mast{background:none;color:#000;border-bottom:2px solid #000}
  .mast .zh{color:#444}
  .viewer{display:none}
}

        return x;
      }),
      updated: String(it.updated || '')
    };
    if (it.type === 'link' || it.type === 'page') o.type = it.type;
    else o.type = safeUrl(o.link) && !hasBody(o) && !o.files.length ? 'link' : 'page';
    return o;
  });
  return { version: 2, updated: String(j.updated || ''), site: site, items: items };
}

/* Base64 (hỗ trợ tiếng Việt / tiếng Trung) */
function bytesToB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(b64) { const s = atob(String(b64).replace(/\s/g, '')); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
const utf8ToB64 = str => bytesToB64(new TextEncoder().encode(str));
const b64ToUtf8 = b64 => new TextDecoder().decode(b64ToBytes(b64));
function fileToB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('Không đọc được tệp "' + file.name + '".'));
    r.readAsDataURL(file);
  });
}
function safeName(name) {
  const ext = extOf(name);
  let base = String(name).slice(0, Math.max(0, String(name).length - ext.length - 1));
  base = base.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 60) || 'tep';
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '-' + Math.random().toString(36).slice(2, 6) + '-' + base + '.' + ext;
}

/* Làm sạch HTML (dán từ Word, nội dung bài viết) */
const KEEP = ['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'SUB', 'SUP', 'MARK', 'CODE', 'PRE', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'A', 'BLOCKQUOTE', 'HR', 'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TH', 'TD', 'CAPTION', 'IMG', 'DIV', 'FIGURE', 'FIGCAPTION'];
const KILL = ['SCRIPT', 'STYLE', 'IFRAME', 'FRAME', 'FRAMESET', 'OBJECT', 'EMBED', 'LINK', 'META', 'TITLE', 'HEAD', 'NOSCRIPT', 'TEMPLATE', 'SVG', 'MATH', 'FORM', 'INPUT', 'BUTTON', 'SELECT', 'OPTION', 'TEXTAREA', 'VIDEO', 'AUDIO', 'SOURCE', 'CANVAS', 'BASE', 'XML'];
const RENAME = { H1: 'H2', H5: 'H4', H6: 'H4', STRIKE: 'S', DEL: 'S', INS: 'U', SECTION: 'DIV', ARTICLE: 'DIV', HEADER: 'DIV', FOOTER: 'DIV', MAIN: 'DIV', ASIDE: 'DIV', NAV: 'DIV', CENTER: 'DIV' };
function unwrap(el) { el.replaceWith.apply(el, Array.from(el.childNodes)); }
function scrub(parent, doc) {
  Array.from(parent.childNodes).forEach(node => {
    if (node.nodeType === 3) return;
    if (node.nodeType !== 1) { node.remove(); return; }
    let el = node, tag = el.tagName.toUpperCase();
    if (KILL.indexOf(tag) >= 0) { el.remove(); return; }
    if (RENAME[tag]) {
      const n = doc.createElement(RENAME[tag]);
      while (el.firstChild) n.appendChild(el.firstChild);
      el.replaceWith(n); el = n; tag = RENAME[tag];
    }
    if (KEEP.indexOf(tag) < 0) { scrub(el, doc); unwrap(el); return; }
    const keep = {};
    if (tag === 'A') {
      const h = safeUrl(el.getAttribute('href'));
      if (h) keep.href = h;
    } else if (tag === 'IMG') {
      const s = (el.getAttribute('src') || '').trim();
      if (!s || (/^[a-z][a-z0-9+.\-]*:/i.test(s) && !/^https?:/i.test(s))) { el.remove(); return; }
      keep.src = s;
      if (el.getAttribute('alt')) keep.alt = el.getAttribute('alt');
    } else if (tag === 'TD' || tag === 'TH') {
      ['colspan', 'rowspan'].forEach(k => { const v = el.getAttribute(k); if (v && /^\d{1,2}$/.test(v)) keep[k] = v; });
    }
    Array.from(el.attributes).forEach(a => el.removeAttribute(a.name));
    Object.keys(keep).forEach(k => el.setAttribute(k, keep[k]));
    if (tag === 'A') {
      if (!keep.href) { scrub(el, doc); unwrap(el); return; }
      el.setAttribute('target', '_blank');
      el.setAttribute('rel', 'noopener');
    }
    scrub(el, doc);
  });
}
function sanitize(html) {
  if (!html) return '';
  const doc = new DOMParser().parseFromString('<!DOCTYPE html><html><body>' + html + '</body></html>', 'text/html');
  scrub(doc.body, doc);
  let last = doc.body.lastChild;
  while (last && ((last.nodeType === 3 && !last.textContent.trim()) ||
    (last.nodeType === 1 && last.tagName === 'P' && !last.textContent.replace(/\u00a0/g, ' ').trim() && !last.querySelector('img')))) {
    last.remove(); last = doc.body.lastChild;
  }
  return doc.body.innerHTML.trim();
}

/* ======================= GITHUB ======================= */
const repoUrl = (o, r) => '/repos/' + encodeURIComponent(o) + '/' + encodeURIComponent(r);
const encPath = p => String(p).split('/').map(encodeURIComponent).join('/');
const cUrl = (cfg, p) => { const b = String(cfg.base || '').replace(/^\/+|\/+$/g, ''); return repoUrl(cfg.owner, cfg.repo) + '/contents/' + encPath((b ? b + '/' : '') + p); };
const contentsUrl = p => cUrl(admin, p);
const refQ = cfg => '?ref=' + encodeURIComponent((cfg || admin).branch) + '&t=' + Date.now();

function ghError(status, j) {
  const m = (j && j.message) || '';
  let msg;
  if (status === 0) msg = 'Không kết nối được tới GitHub. Kiểm tra mạng rồi thử lại.';
  else if (status === 401) msg = 'GitHub token không hợp lệ hoặc đã hết hạn.';
  else if (status === 403) msg = /rate limit/i.test(m) ? 'GitHub đang giới hạn số lần truy cập. Thử lại sau vài phút.' : 'Token chưa có quyền ghi. Cấp quyền Contents: Read and write cho repo này.';
  else if (status === 404) msg = 'Không tìm thấy repo, nhánh hoặc tệp trên GitHub. Kiểm tra lại tên repo và quyền của token.';
  else if (status === 409 || (status === 422 && /sha/i.test(m))) msg = 'Nội dung trên GitHub vừa được sửa ở nơi khác. Tải lại trang rồi thực hiện lại.';
  else if (status === 413 || (status === 422 && /too large|size/i.test(m))) msg = 'Tệp quá lớn để tải lên qua GitHub.';
  else msg = 'GitHub báo lỗi ' + status + (m ? ': ' + m : '') + '.';
  const e = new Error(msg);
  e.status = status;
  return e;
}
async function gh(method, path, body, token) {
  token = token || (admin && admin.token);
  const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token };
  if (body) headers['Content-Type'] = 'application/json';
  let res;
  try { res = await fetch(API + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw ghError(0); }
  let json = null;
  try { json = await res.json(); } catch (e) { /* phản hồi rỗng */ }
  if (!res.ok) throw ghError(res.status, json);
  return json;
}
function ghUpload(path, b64, message, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', API + contentsUrl(path));
    xhr.setRequestHeader('Accept', 'application/vnd.github+json');
    xhr.setRequestHeader('Authorization', 'Bearer ' + admin.token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    if (onProgress) xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      let j = null;
      try { j = JSON.parse(xhr.responseText); } catch (e) { /* bỏ qua */ }
      if (xhr.status >= 200 && xhr.status < 300) resolve(j); else reject(ghError(xhr.status, j));
    };
    xhr.onerror = () => reject(ghError(0));
    xhr.send(JSON.stringify({ message: message, content: b64, branch: admin.branch }));
  });
}
/* Ghi một tệp vào repo (tự lấy phiên bản cũ nếu tệp đã có) */
async function putRepoFile(cfg, path, b64, message, token) {
  let sha = null;
  try { const m = await gh('GET', cUrl(cfg, path) + refQ(cfg), null, token); sha = m && m.sha; }
  catch (e) { if (e.status !== 404) throw e; }
  const body = { message: message, content: b64, branch: cfg.branch };
  if (sha) body.sha = sha;
  return gh('PUT', cUrl(cfg, path), body, token);
}
async function deleteFiles(list) {
  for (const f of list) {
    if (!f || !f.path || f.path.indexOf(FILE_DIR + '/') !== 0) continue; // chỉ xóa trong thư mục files/
    try {
      let sha = f.sha;
      if (!sha) { const m = await gh('GET', contentsUrl(f.path) + refQ()); sha = m && m.sha; }
      if (sha) await gh('DELETE', contentsUrl(f.path), { message: 'Xóa tệp ' + f.path, sha: sha, branch: admin.branch });
    } catch (e) { console.warn('Không xóa được tệp', f.path, e); }
  }
}
async function loadPublic() {
  try {
    const r = await fetch(DATA_FILE + '?v=' + Math.floor(Date.now() / 60000), { cache: 'no-cache' });
    if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.items)) return normalizeData(j); }
  } catch (e) { /* chưa có data.json hoặc mở trang ngoài GitHub Pages */ }
  return normalizeData(DEFAULT_DATA);
}
async function loadFromApi() {
  let j;
  try { j = await gh('GET', contentsUrl(DATA_FILE) + refQ()); }
  catch (e) { if (e.status === 404) { dataSha = null; return; } throw e; }
  dataSha = j.sha || null;
  try {
    let text = j.content ? b64ToUtf8(j.content) : '';
    if (!text && j.download_url) text = await (await fetch(j.download_url)).text();
    const fresh = normalizeData(JSON.parse(text));
    if (!dirty) data = fresh;
  } catch (e) {
    toast('Tệp data.json trên GitHub bị lỗi định dạng. Lần "Đăng" kế tiếp sẽ ghi đè bằng nội dung đang hiển thị.', 'bad');
  }
}
async function publish(next, message) {
  next.updated = new Date().toISOString();
  const body = { message: message, content: utf8ToB64(JSON.stringify(next, null, 2) + '\n'), branch: admin.branch };
  if (dataSha) body.sha = dataSha;
  const r = await gh('PUT', contentsUrl(DATA_FILE), body);
  dataSha = (r && r.content && r.content.sha) || dataSha;
  data = next;
  dirty = 0;
  const del = pendingDeletes.splice(0);
  if (del.length) serial(() => deleteFiles(del));
}

/* ======================= TÀI KHOẢN QUẢN TRỊ =======================
   GitHub Pages không có máy chủ, nên "chìa khóa" ghi vào repo (GitHub token)
   được mã hóa bằng tên đăng nhập + mật khẩu rồi lưu ở admin.json.
   Đăng nhập đúng thì giải mã được chìa khóa; sai thì không làm gì được. */
async function deriveKey(user, pass, salt, iter) {
  const material = new TextEncoder().encode(String(user).trim().toLowerCase() + '\n' + pass);
  const base = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealAdmin(payload, user, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(user, pass, salt, KDF_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(payload))));
  return { v: 2, kdf: 'PBKDF2-SHA256', iter: KDF_ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function unsealAdmin(blob, user, pass) {
  const iter = Number(blob.iter) || KDF_ITER;
  if (iter < 100000 || iter > 5000000) throw new Error('admin.json không hợp lệ');
  const key = await deriveKey(user, pass, b64ToBytes(blob.salt), iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  const o = JSON.parse(new TextDecoder().decode(pt));
  if (!o || !o.token || !o.owner || !o.repo || !o.branch) throw new Error('admin.json không hợp lệ');
  return o;
}
async function saveAdminBlob(cfg, token, user, pass) {
  const sealed = await sealAdmin({ token: token, owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, base: cfg.base || '' }, user, pass);
  await putRepoFile(cfg, ADMIN_FILE, utf8ToB64(JSON.stringify(sealed, null, 2) + '\n'), 'Cập nhật tài khoản quản trị', token);
}
function weakPass(p) {
  if (p.length < 10) return 'Mật khẩu cần ít nhất 10 ký tự.';
  if (!/[a-zA-Z]/.test(p) || !/\d/.test(p)) return 'Mật khẩu cần có cả chữ và số.';
  if (/^(.)\1+$/.test(p) || /^(0123456789|1234567890|abcdefghij|qwertyuiop)/i.test(p)) return 'Mật khẩu quá dễ đoán. Hãy chọn mật khẩu khác.';
  return '';
}
function detectRepo() {
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return null;
  const owner = m[1], segs = location.pathname.split('/').filter(Boolean);
  let repo = owner + '.github.io', rest = segs;
  if (segs.length && !/\.html?$/i.test(segs[0])) { repo = segs[0]; rest = segs.slice(1); }
  if (rest.length && /\.html?$/i.test(rest[rest.length - 1])) rest = rest.slice(0, -1);
  return { owner: owner, repo: repo, base: rest.join('/') };
}
async function fetchAdminBlob() {
  const ok = j => j && j.ct && j.salt && j.iv;
  try {
    const r = await fetch(ADMIN_FILE + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (ok(j)) return j; }
  } catch (e) { /* chưa có admin.json */ }
  const det = detectRepo(); // trang vừa kích hoạt, GitHub Pages chưa kịp cập nhật: đọc thẳng từ repo
  if (det) {
    try {
      const r = await fetch(API + repoUrl(det.owner, det.repo) + '/contents/' + encPath((det.base ? det.base + '/' : '') + ADMIN_FILE) + '?t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' } });
      if (r.ok) { const j = await r.json(); if (ok(j)) return j; }
    } catch (e) { /* bỏ qua */ }
  }
  return null;
}

      <details class="help" id="a-adv"${det.owner ? '' : ' open'}><summary>Repo: ${det.owner ? esc(det.owner + '/' + det.repo) : 'chưa xác định, bấm để nhập'}</summary><div class="help-in">
        <div class="grid2">
          <label class="field"><span>Tài khoản GitHub</span><input class="input" id="a-own" value="${esc(det.owner || '')}" placeholder="vd: tailscalen"></label>
          <label class="field"><span>Tên repo</span><input class="input" id="a-repo" value="${esc(det.repo || '')}"></label>
        </div>
        <div class="grid2">
          <label class="field"><span>Nhánh <em>(trống = tự nhận)</em></span><input class="input" id="a-br" placeholder="main"></label>
          <label class="field"><span>Thư mục chứa trang <em>(nếu có)</em></span><input class="input" id="a-dir" value="${esc(det.base || '')}" placeholder="trống nếu ở gốc repo"></label>
        </div>
      </div></details>
      <div class="err" id="a-err"></div>
      <button class="btn primary block" id="a-btn" type="submit">${isReset ? 'Kích hoạt lại' : 'Kích hoạt'}</button>
    </form>`, 'md');
  const $a = s => ov.querySelector(s);
  $a('#af').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $a('#a-err'), btn = $a('#a-btn');
    err.textContent = '';
    const token = $a('#a-tok').value.trim();
    const user = $a('#a-user').value.trim();
    const p1 = $a('#a-p1').value, p2 = $a('#a-p2').value;
    const owner = $a('#a-own').value.trim(), repo = $a('#a-repo').value.trim();
    let branch = $a('#a-br').value.trim();
    const baseInput = $a('#a-dir').value.trim().replace(/^\/+|\/+$/g, '');
    if (!token) { err.textContent = 'Dán GitHub token vào ô đầu tiên.'; return; }
    if (user.length < 3) { err.textContent = 'Tên đăng nhập cần ít nhất 3 ký tự.'; return; }
    const weak = weakPass(p1);
    if (weak) { err.textContent = weak; return; }
    if (p1 !== p2) { err.textContent = 'Hai mật khẩu chưa giống nhau.'; return; }
    if (!owner || !repo) { $a('#a-adv').open = true; err.textContent = 'Nhập tài khoản GitHub và tên repo.'; return; }
    busy(btn, true, 'Đang kích hoạt…');
    try {
      const info = await gh('GET', repoUrl(owner, repo), null, token);
      let base = baseInput;
      if (!branch) {
        try { // hỏi GitHub xem trang đang chạy từ nhánh/thư mục nào (cần quyền Pages, không có thì bỏ qua)
          const pg = await gh('GET', repoUrl(owner, repo) + '/pages', null, token);
          if (pg && pg.source && pg.source.branch) {
            branch = pg.source.branch;
            const pp = String(pg.source.path || '').replace(/^\/+|\/+$/g, '');
            if (pp && baseInput === (det.base || '')) base = [pp, baseInput].filter(Boolean).join('/');
          }
        } catch (x) { /* dùng nhánh mặc định */ }
      }
      if (!branch) branch = (info && info.default_branch) || 'main';
      const cfg = { owner: owner, repo: repo, branch: branch, base: base };
      await saveAdminBlob(cfg, token, user, p1);
      lsSet(USER_KEY, user);
      startSession(token, cfg, 'Đã kích hoạt. Từ giờ đăng nhập bằng tên và mật khẩu vừa tạo.');
    } catch (x) {
      busy(btn, false);
      if (x.status === 404) { $a('#a-adv').open = true; err.textContent = 'Không thấy repo "' + owner + '/' + repo + '". Kiểm tra tên repo và việc token đã được cấp quyền cho repo này.'; }
      else err.textContent = x.message;
    }
  });
}
function startSession(token, cfg, msg) {
  admin = { token: token, owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, base: cfg.base || '' };
  try { if (SS) SS.setItem(SS_KEY, JSON.stringify(admin)); } catch (e) { /* bỏ qua */ }
  closeModal();
  enterAdmin(msg);
}
async function enterAdmin(msg) {
  document.body.classList.add('is-admin');
  render();
  try {
    await loadFromApi();
    render();
    if (msg) toast(msg, 'ok');
  } catch (e) {
    if (e.status === 401) {
      admin = null;
      try { if (SS) SS.removeItem(SS_KEY); } catch (x) { /* bỏ qua */ }
      document.body.classList.remove('is-admin');
      render();
      toast('GitHub token đã hết hạn. Đăng nhập lại và dán token mới khi được hỏi.', 'bad');
    } else toast(e.message, 'bad');
  }
}
function logout() {

/* ======================= CHIA SẺ ======================= */
async function shareLink(url, title) {
  if (navigator.share) {
    try { await navigator.share({ title: title, url: url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Đã sao chép đường link. Dán vào Zalo, Facebook hoặc email để chia sẻ.', 'ok'); }
  catch (e) { window.prompt('Sao chép đường link này để chia sẻ:', url); }
}
function shareItem(id) {
  const it = data.items.find(x => x.id === id);
  if (it) shareLink(pageUrl() + '#/sop/' + it.id, [it.titleVi, it.titleZh].filter(Boolean).join(' / '));
}
function shareSite() { shareLink(pageUrl(), [data.site.titleVi, data.site.titleZh].filter(Boolean).join(' / ')); }

/* ======================= HỘP THOẠI & THÔNG BÁO ======================= */
function openModal(html, size, onClose) {
  if (modal) closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay' + (size === 'sm' ? '' : ' sheet');
  ov.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || (size === 'sm' && e.target === ov)) tryClose();
  });
  document.body.appendChild(ov);
  document.body.classList.add('no-scroll');
  modal = { ov: ov, onClose: onClose, cleanups: [] };
  if (size === 'sm') setTimeout(() => { const f = ov.querySelector('input'); if (f) f.focus(); }, 50);
  return ov;
}
function tryClose() { if (!modal) return; if (modal.onClose && modal.onClose() === false) return; closeModal(); }
function closeModal() {
  if (!modal) return;
  modal.cleanups.forEach(fn => { try { fn(); } catch (e) { /* bỏ qua */ } });
  modal.ov.remove();
  modal = null;
  document.body.classList.remove('no-scroll');
}
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, type === 'bad' ? 7000 : 3800);
}
function busy(btn, on, text) {
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + esc(text || ''); }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; delete btn.dataset.html; }
}

/* ======================= THAO TÁC DANH MỤC ======================= */
function move(id, d) {
  const a = data.items, i = a.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= a.length) return;
  const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  dirty++;
  renderList();
  renderAdminBar();
}
function delItem(id) {
  const it = data.items.find(x => x.id === id);
  if (!it) return;
  if (!confirm('Xóa “' + (it.titleVi || 'mục này') + '”?' + (it.files.length ? ' Tệp đính kèm của mục cũng sẽ bị xóa khỏi GitHub.' : '') + ' Thay đổi có hiệu lực sau khi bấm Đăng.')) return;
  data.items = data.items.filter(x => x !== it);
  pendingDeletes = pendingDeletes.concat(it.files);
  dirty++;
  if (location.hash.indexOf('#/sop/' + id) === 0) location.hash = '#/'; else render();
  toast('Đã xóa khỏi danh mục. Bấm Đăng để áp dụng.');
}
async function publishPending() {
  if (!dirty) return;
  busy(document.querySelector('[data-act="publish"]'), true, 'Đang đăng…');
  try {
    await serial(() => publish(clone(data), 'Cập nhật danh mục'));
    toast('Đã đăng thay đổi. Trang công khai cập nhật sau khoảng 1–2 phút.', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
  render();
}

function setupRte(ov, area) {
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* bỏ qua */ }
  const bar = ov.querySelector('.rte-bar');
  let saved = null;
  const onSel = () => { const s = window.getSelection(); if (s && s.rangeCount && area.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange(); };
  document.addEventListener('selectionchange', onSel);
  modal.cleanups.push(() => document.removeEventListener('selectionchange', onSel));
  const restore = () => { area.focus(); if (saved) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(saved); } };
  const syncEmpty = () => area.classList.toggle('is-empty', !area.textContent.trim() && !area.querySelector('img,table,hr,li'));
  const changed = () => { if (ed) ed.touched = true; syncEmpty(); };
  bar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  bar.addEventListener('click', e => {
    const btn = e.target.closest('button[data-cmd]');
    if (!btn) return;
    const cmd = btn.getAttribute('data-cmd'), val = btn.getAttribute('data-val');
    restore();
    if (cmd === 'createLink') {
      const u = prompt('Dán liên kết (https://…):', 'https://');
      restore();
      const url = u ? fixUrl(u) : '';
      if (!url || url === 'https://') return;
      if (window.getSelection().isCollapsed) document.execCommand('insertHTML', false, '<a href="' + esc(url) + '">' + esc(url) + '</a>&nbsp;');
      else document.execCommand('createLink', false, url);
    } else if (cmd === 'formatBlock') {
      document.execCommand('formatBlock', false, '<' + val + '>');
    } else if (cmd === 'removeFormat') {
      document.execCommand('removeFormat');
      document.execCommand('formatBlock', false, '<p>');
    } else {
      document.execCommand(cmd, false, null);
    }
    changed();
  });
  area.addEventListener('input', changed);
  area.addEventListener('paste', e => {
    const cd = e.clipboardData;
    if (!cd) return;
    const html = cd.getData('text/html'), text = cd.getData('text/plain');
    if (!html && !text) {
      if (cd.files && cd.files.length) { e.preventDefault(); addFiles(cd.files); toast('Ảnh vừa dán được đưa vào mục Tệp đính kèm.'); }
      return;
    }
    e.preventDefault();
    const clean = html ? sanitize(html) : esc(text).replace(/\r?\n/g, '<br>');
    document.execCommand('insertHTML', false, clean);
    changed();
  });
  area.addEventListener('drop', e => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); addFiles(e.dataTransfer.files); }
  });
  syncEmpty();
}
function renderEdFiles() {
  const ul = document.getElementById('e-files');
  if (!ul || !ed) return;
  const done = ed.it.files.map((f, i) => {
    const t = ftype(f.path);
    return `<li class="frow">${tileHtml({ cls: 't-' + t.cls, icon: t.img ? 'image' : 'file', label: t.label }, 'sm')}<span class="f-info"><span class="f-name">${esc(f.name)}</span><span class="f-size">${f.size ? fmtSize(f.size) : ''}</span></span><button type="button" class="icon-btn sm" data-fdel="${i}" title="Gỡ tệp" aria-label="Gỡ tệp ${esc(f.name)}">${ic('x', 17)}</button></li>`;
  });
  const up = ed.queue.map(q => {
    const t = ftype(q.name);
    return `<li class="frow"><span class="tile sm t-${t.cls}"><span class="spin"></span></span><span class="f-info"><span class="f-name">${esc(q.name)}</span><span class="f-size" id="pt-${q.key}">Chờ tải lên…</span><span class="prog"><i id="pb-${q.key}"></i></span></span></li>`;
  });
  ul.innerHTML = done.concat(up).join('');
}
function setProg(key, p) {
  const bar = document.getElementById('pb-' + key), txt = document.getElementById('pt-' + key);
  if (bar) bar.style.width = Math.round(p * 100) + '%';
  if (txt) txt.textContent = p >= 1 ? 'Đang lưu vào GitHub…' : 'Đang tải lên ' + Math.round(p * 100) + '%';
}
function updateSaveBtn() {
  const b = document.getElementById('e-save');
  if (b && !b.dataset.html) b.disabled = !!(ed && ed.uploading);
}
async function addFiles(list) {
  const my = ed;
  if (!my) return;
  const files = Array.from(list || []);
  const jobs = [];
  files.forEach(file => {
    const ext = extOf(file.name);
    if (!FTYPES[ext]) { toast('Không hỗ trợ tệp ' + (ext ? '.' + ext : file.name) + '. Dùng PPTX, PDF, Word, Excel hoặc ảnh.', 'bad'); return; }
    if (file.size > MAX_MB * 1048576) { toast('“' + file.name + '” lớn hơn ' + MAX_MB + ' MB. Hãy nén ảnh trong tệp rồi tải lại.', 'bad'); return; }
    const q = { key: uid(), name: file.name };
    my.queue.push(q);
    my.uploading++;
    jobs.push({ file: file, q: q });
  });
  if (!jobs.length) return;
  my.touched = true;
  if (ed === my) { renderEdFiles(); updateSaveBtn(); }
  for (const job of jobs) {
    try {
      const path = FILE_DIR + '/' + safeName(job.file.name);
      const b64 = await fileToB64(job.file);
      const res = await serial(() => ghUpload(path, b64, 'Tải lên ' + job.file.name, p => setProg(job.q.key, p)));
      const f = { name: job.file.name, path: path, size: job.file.size };
      if (res && res.content && res.content.sha) f.sha = res.content.sha;
      my.it.files.push(f);
      my.uploaded.push(f);
    } catch (e) {
      toast('Chưa tải được “' + job.file.name + '”. ' + e.message, 'bad');
    } finally {
      my.queue = my.queue.filter(x => x !== job.q);
      my.uploading--;
      if (ed === my) { renderEdFiles(); updateSaveBtn(); }
    }
  }
}
function removeEdFile(i) {
  const f = ed.it.files.splice(i, 1)[0];
  if (!f) return;
  ed.touched = true;
  if (ed.uploaded.indexOf(f) >= 0) {
    ed.uploaded = ed.uploaded.filter(x => x !== f);
    serial(() => deleteFiles([f]));
  } else {
    ed.removed.push(f);
  }
  renderEdFiles();
}
function editorGuard() {
  if (!ed) return true;
  if (ed.uploading) { toast('Đang tải tệp lên. Đợi tải xong rồi hãy đóng.', 'bad'); return false; }
  if (ed.touched && !confirm('Bỏ các thay đổi chưa lưu?')) return false;
  if (ed.uploaded.length) { const orphans = ed.uploaded.slice(); serial(() => deleteFiles(orphans)); }
  ed = null;
  return true;
}
async function saveEditor() {
  if (!ed || ed.uploading) return;
  const ov = modal && modal.ov;
  if (!ov) return;
  const err = ov.querySelector('#e-err'), btn = ov.querySelector('#e-save');
  err.textContent = '';
  const it = ed.it;
  it.type = it.type === 'link' ? 'link' : 'page';
  it.titleVi = ov.querySelector('#e-vi').value.trim();
  it.titleZh = ov.querySelector('#e-zh').value.trim();
  it.code = ov.querySelector('#e-code').value.trim();
  const rawLink = ov.querySelector('#e-link').value.trim();
  it.link = rawLink ? fixUrl(rawLink) : '';
  if (!it.titleVi) { err.textContent = 'Nhập tên hiển thị tiếng Việt.'; ov.querySelector('#e-vi').focus(); return; }
  if (rawLink && !it.link) { err.textContent = 'Đường link chưa đúng. Đường link cần bắt đầu bằng https://'; ov.querySelector('#e-link').focus(); return; }
  if (it.type === 'link' && !it.link) { err.textContent = 'Nhập đường link sẽ mở khi bấm vào mục.'; ov.querySelector('#e-link').focus(); return; }
  const body = sanitize(ov.querySelector('#e-area').innerHTML);
  it.body = hasBody({ body: body }) ? body : '';
  it.updated = new Date().toISOString();
  if (ed.isNew) it.id = uniqueSlug(it.titleVi);
  const next = clone(data);
  const idx = next.items.findIndex(x => x.id === it.id);
  if (idx >= 0) next.items[idx] = it; else next.items.push(it);
  const removed = ed.removed.slice();
  busy(btn, true, 'Đang đăng…');
  pendingDeletes = pendingDeletes.concat(removed);
  try {
    await serial(() => publish(next, (ed.isNew ? 'Thêm: ' : 'Sửa: ') + it.titleVi));
    const isNew = ed.isNew;
    ed = null;
    closeModal();
    toast('Đã lưu và đăng. Trang công khai cập nhật sau khoảng 1–2 phút.', 'ok');
    if (isNew && !isDirect(it)) location.hash = '#/sop/' + it.id; else render();
  } catch (e) {
    pendingDeletes = pendingDeletes.filter(f => removed.indexOf(f) < 0);
    if (ed && ed.isNew) it.id = '';
    busy(btn, false);
    err.textContent = e.message;
  }
}
